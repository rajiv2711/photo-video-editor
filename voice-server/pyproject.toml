[project]
name = "voice-server"
version = "0.1.0"
description = "Laptop speech-to-text server for the iPad editor (Whisper). Development-phase only."
requires-python = ">=3.12,<3.13"
dependencies = [
    "fastapi>=0.115",
    "uvicorn>=0.30",
    "faster-whisper>=1.1",
    # CUDA 12 libraries for faster-whisper's GPU path, kept inside this environment.
    "nvidia-cublas-cu12>=12.4",
    "nvidia-cudnn-cu12>=9,<10",
]

[dependency-groups]
dev = [
    "pytest>=8",
    "httpx>=0.27",
    # Synthetic voices for the laptop voice test (dev-tools/voice_test.py).
    "piper-tts>=1.2",
]

[tool.uv]
package = false
