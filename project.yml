# XcodeGen spec. The cloud build turns this into PhotoVideoEditor.xcodeproj (not committed).
name: PhotoVideoEditor
options:
  bundleIdPrefix: io.github.rajiv2711
  deploymentTarget:
    iOS: "17.0"
packages:
  EditorCore:
    path: EditorCore
targets:
  PhotoVideoEditor:
    type: application
    platform: iOS
    sources: [App]
    dependencies:
      - package: EditorCore
    scheme: {}
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: io.github.rajiv2711.photovideoeditor
        TARGETED_DEVICE_FAMILY: "2"
        MARKETING_VERSION: "0.1.0"
        CURRENT_PROJECT_VERSION: "1"
        SWIFT_VERSION: "5.0"
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_CFBundleDisplayName: Editor
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        INFOPLIST_KEY_UIApplicationSceneManifest_Generation: YES
        INFOPLIST_KEY_UISupportedInterfaceOrientations_iPad: >-
          UIInterfaceOrientationPortrait UIInterfaceOrientationPortraitUpsideDown
          UIInterfaceOrientationLandscapeLeft UIInterfaceOrientationLandscapeRight
        INFOPLIST_KEY_NSPhotoLibraryAddUsageDescription: Save your edited photos to your library.
